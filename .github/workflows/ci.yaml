---
name: CI

# The paths allowlist below is duplicated across push and pull_request on
# purpose: GitHub does not expand YAML anchors in `on:`, so the two lists have
# to be kept in sync by hand. Anything not listed — docs/**, the READMEs,
# CLAUDE.md, .pre-commit-config.yaml, .gitignore, the Renovate config — cannot
# affect a build, a test or a release artifact, so it starts no run at all.
#
# workflow_dispatch and schedule are deliberately unfiltered; GitHub does not
# accept `paths:` on them anyway, and contract-drift depends on the schedule
# firing unconditionally.
on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "test/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - "Makefile"
      - ".semrelrc"
      - ".github/workflows/ci.yaml"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "test/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - "Makefile"
      - ".semrelrc"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"  # Weekly, Mondays 05:00 UTC — contract-drift only

permissions:
  contents: read

env:
  # The oldest td td-gui supports, and the version the API contract in
  # test/contract was probed against. Keep in sync with minTdVersion in
  # cmd/td-gui/main.go.
  TD_VERSION: v0.57.0

jobs:
  test-go:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test-go
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The race build's instrumented objects differ from the lint job's, so
      # give this job its own rolling go-build cache: the sha suffix forces a
      # fresh save each run, restore-keys pull the newest prior race build so
      # only changed packages recompile.
      - name: Cache go-build (race)
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-test-${{ runner.os }}-

      # test/contract drives a real td binary and SKIPS ITSELF when td is
      # absent — `go test ./...` would still print ok. Installing td is what
      # makes the contract suite actually run; the version check below fails
      # the job if it did not land on PATH, so the skip can never go unnoticed.
      - name: Install td ${{ env.TD_VERSION }}
        run: |
          set -euo pipefail
          go install "github.com/marcus/td@${TD_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify td is on PATH
        run: td --version

      # go:embed needs a non-empty dist to compile. The committed .gitkeep
      # satisfies that, so the Go suite needs no web build — internal/web's
      # tests skip themselves without one, which is expected here and covered
      # by the build job.
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  lint-go:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint-go
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # golangci-lint keeps its own analysis cache but leans on go-build for
      # type-checking. Separate key so it doesn't evict the race build.
      - name: Cache go-build (lint)
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-lint-${{ runner.os }}-
      - uses: golangci/golangci-lint-action@v9

  tidy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-tidy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Guard against go.mod/go.sum drift: bumps accumulate stale module
      # hashes without ever pruning. Fail on any diff so contributors must
      # commit the tidied result.
      - name: Verify go.mod/go.sum are tidy
        run: |
          set -euo pipefail
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the result."
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-web
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      # tsc -b runs as part of the build, so this type-checks too.
      - run: npm run build
        working-directory: web
      - run: npm test -- --run
        working-directory: web

  build:
    needs: [test-go, web]
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cache go-build (binary)
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-build-${{ runner.os }}-
      # Full pipeline: web bundle into internal/web/dist, then the Go binary.
      - run: make build
      # With a real bundle embedded, internal/web's three tests stop skipping
      # and assert for real. This is the only job where that happens.
      - name: Re-run embed tests against the real bundle
        run: go test -count=1 ./internal/web/ -v

  # Cuts a release from main once every gate above is green. go-semantic-release
  # derives the version from the commit subjects since the last tag, so the
  # scopes in CLAUDE.md decide what ships: feat -> minor, fix/perf/refactor/
  # chore(deps) -> patch, a `!` -> major. docs/test/ci/style commits produce no
  # version at all.
  #
  # The paths allowlist at the top of this file cannot strand a version bump.
  # The baseline is the last *tag*, not the last run, so a push filtered out
  # here leaves its commits in the range: the next push that does trigger picks
  # them up and ships them. Filtering delays a release, it never drops one.
  #
  # Unlike the other jobs this one must not cancel-in-progress. A cancel
  # between "Publish Git tag + GitHub Release" and "Upload binary" would leave
  # a tag that permanently lacks its binary — the next run computes the *next*
  # version and never heals it. So releases serialize (cancel-in-progress:
  # false) and the staleness guard below skips runs whose commit is no longer
  # the main tip. That guard is what keeps go-semantic-release's "latest
  # release" baseline an ancestor of HEAD when two pushes race.
  release:
    needs: [test-go, lint-go, tidy, web, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Skip release if not the current main tip
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TIP="$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)"
          if [ "$TIP" != "${{ github.sha }}" ]; then
            echo "::notice::HEAD ${{ github.sha }} is no longer the main tip (${TIP}); skipping release."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned semantic-release binary
        if: steps.guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          curl -fsSL \
            https://github.com/go-semantic-release/semantic-release/releases/download/v2.31.0/semantic-release_v2.31.0_linux_amd64 \
            -o /tmp/semantic-release
          chmod +x /tmp/semantic-release
          /tmp/semantic-release --version

      # Splitting dry-run from publish is what lets the binary carry the tag:
      # the version has to be known before `make build`, but the tag must not
      # exist until the artifact it points at has been built.
      - name: Determine next version (dry-run)
        id: semrel-dry
        if: steps.guard.outputs.proceed == 'true'
        # go-semantic-release/action v1.24.1
        uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f
        with:
          bin: /tmp/semantic-release
          dry: true
          allow-initial-development-versions: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Everything below is skipped when the commits since the last tag warrant
      # no release, so a docs-only push installs no toolchain at all.
      - uses: actions/setup-go@v7
        if: steps.semrel-dry.outputs.version != ''
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        if: steps.semrel-dry.outputs.version != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The build job cannot hand this binary over: it runs before the version
      # is known. Same commit, same `make build`, plus the stamped tag.
      - name: Build the release binary
        if: steps.semrel-dry.outputs.version != ''
        env:
          VERSION: ${{ steps.semrel-dry.outputs.version }}
        run: |
          set -euo pipefail
          make build GO_LDFLAGS="-X main.buildVersion=v${VERSION}"
          ./td-gui --version

      - name: Publish Git tag + GitHub Release
        if: steps.semrel-dry.outputs.version != ''
        # go-semantic-release/action v1.24.1
        uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f
        with:
          bin: /tmp/semantic-release
          allow-initial-development-versions: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename binary + checksum for release
        if: steps.semrel-dry.outputs.version != ''
        env:
          VERSION: ${{ steps.semrel-dry.outputs.version }}
        run: |
          set -euo pipefail
          OUT="td-gui-v${VERSION}-linux-amd64"
          mv td-gui "$OUT"
          sha256sum "$OUT" > "${OUT}.sha256"
          ls -la td-gui-*

      - name: Upload binary to GitHub Release
        if: steps.semrel-dry.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.semrel-dry.outputs.version }}
        run: |
          gh release upload "v${VERSION}" \
            "td-gui-v${VERSION}-linux-amd64" \
            "td-gui-v${VERSION}-linux-amd64.sha256" \
            --clobber

  # The contract suite exists to catch renames in td's API. Pinning the test
  # job to TD_VERSION makes CI reproducible but blind to exactly that drift,
  # so re-run it against the newest td on a schedule instead of failing
  # unrelated pull requests when td ships a release.
  contract-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install latest td
        run: |
          set -euo pipefail
          go install github.com/marcus/td@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Report td version under test
        run: td --version
      - run: go test -count=1 -v ./test/contract/
