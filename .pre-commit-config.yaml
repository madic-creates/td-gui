---
exclude: ^(web/node_modules/|internal/web/dist/|web/package-lock\.json$)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Trims trailing whitespace.
      - id: trailing-whitespace
      # Makes sure files end in a newline and only a newline.
      - id: end-of-file-fixer
      # Replaces or checks mixed line ending.
      - id: mixed-line-ending
      # Detect strings that look like private keys.
      - id: detect-private-key
      # Check for files that contain merge conflict strings.
      - id: check-merge-conflict
      - id: check-yaml
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      # Replace CRLF end-lines by LF ones before committing
      - id: remove-crlf
  - repo: https://github.com/sirosen/fix-smartquotes
    rev: 0.2.0
    hooks:
      # Find and replace smartquote characters with the standard ascii " and '
      # characters. The UI's em dashes and ellipses are untouched by this.
      - id: fix-smartquotes
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'BIN=$(command -v golangci-lint || echo /go/bin/golangci-lint); "$BIN" run'
        language: system
        types: [go]
        pass_filenames: false
      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        types: [go]
        pass_filenames: false
      - id: oxlint
        name: oxlint
        entry: bash -c 'cd web && npm run lint'
        language: system
        files: ^web/src/.*\.(ts|tsx)$
        pass_filenames: false
      - id: typecheck
        name: tsc
        entry: bash -c 'cd web && npm run typecheck'
        language: system
        # Wider than the oxlint and vitest hooks on purpose: a tsconfig or a
        # dependency bump changes what typechecks without touching web/src.
        files: ^web/(src/.*\.(ts|tsx)|tsconfig.*\.json|package\.json)$
        pass_filenames: false
      - id: vitest
        name: vitest
        entry: bash -c 'cd web && npm test -- --run'
        language: system
        files: ^web/src/.*\.(ts|tsx)$
        pass_filenames: false
