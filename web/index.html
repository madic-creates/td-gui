<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>td-gui</title>
    <script>
      /* Resolves the theme before first paint, so a dark-mode user never sees
         a white flash while the bundle loads. Kept inline and duplicated from
         lib/theme.ts on purpose: a module import would be too late. */
      try {
        var stored = localStorage.getItem('td-gui.theme')
        var dark =
          stored === 'dark' ||
          ((!stored || stored === 'auto') &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
